name: Regression

# The full suite on push to main, nightly, and by hand.
on:
  push:
    branches: [main]
  # The site changes without any commit here, so run nightly too.
  schedule:
    - cron: '47 2 * * *'
  # A pull request that changes this workflow runs it before merging.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/regression.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Chromium
        run: npx e2e-web install chromium --with-deps

      - name: Run tests
        run: npx e2e run --reporter list,junit

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: .e2e/
          if-no-files-found: warn
          retention-days: 14
